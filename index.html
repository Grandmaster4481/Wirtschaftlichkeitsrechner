<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familien-Einkaufsliste</title>
    <!-- Tailwind CSS mit Dark Mode Konfiguration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
</head>
<body class="bg-slate-100 dark:bg-slate-900 min-h-screen text-slate-800 dark:text-slate-100 font-sans transition-colors duration-200">

    <div class="max-w-md mx-auto p-4 sm:p-6">
        <!-- Header -->
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-extrabold text-blue-600 dark:text-blue-400 tracking-tight">🛒 Einkaufsliste</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">Familien-PWA mit Markt-Zuordnung</p>
            </div>
            <div class="flex items-center gap-2">
                <!-- Theme Umschalter -->
                <button onclick="toggleTheme()" id="themeToggleBtn" class="text-sm bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 px-3 py-1.5 rounded-xl shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 active:scale-95 transition font-medium" title="Design umschalten">
                    🌙
                </button>
                <button onclick="ladeDaten()" class="text-sm bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 px-3 py-1.5 rounded-xl shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 active:scale-95 transition font-medium">
                    🔄 Laden
                </button>
            </div>
        </header>

        <!-- Eingabeformular -->
        <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-md border border-slate-100 dark:border-slate-700 mb-6 space-y-4 transition-colors">
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Artikel</label>
                    <button onclick="sprachEingabeStarten()" id="micButton" type="button" class="text-xs bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-2.5 py-1 rounded-lg transition flex items-center gap-1 font-semibold">
                        🎤 Einsprechen
                    </button>
                </div>
                <input type="text" id="itemText" placeholder="z. B. Milch, Brot, Äpfel..." class="w-full px-3.5 py-2.5 border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-100">
            </div>

            <div class="flex gap-3">
                <div class="flex-1">
                    <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Supermarkt</label>
                    <!-- Markt-Dropdown -->
                    <select id="marketSelect" class="w-full px-3.5 py-2.5 border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-100 font-medium">
                        <option value="">Lade Märkte...</option>
                    </select>
                </div>
                <div class="w-24">
                    <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Anzahl</label>
                    <input type="text" id="itemQty" value="1" class="w-full px-3.5 py-2.5 border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-900 text-center focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-100">
                </div>
            </div>

            <button onclick="artikelHinzufuegen()" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-500/30 transition active:scale-95">
                + Artikel hinzufügen
            </button>
        </div>

        <!-- Einkaufsliste Anzeige -->
        <div id="shoppingListContainer" class="space-y-2.5">
            <div class="text-center text-slate-400 py-8">Lade Daten aus Google Sheets...</div>
        </div>
    </div>

    <!-- JavaScript Logik -->
    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyraN51T7Olunfs830ukzQZZBxNcZJvgpg1T41sTHhnOy1k-2qtuLQJ31ezOQRBBui7/exec";

        window.addEventListener("DOMContentLoaded", () => {
            initTheme();
            ladeDaten();
        });

        // Theme-Logik
        function initTheme() {
            const savedTheme = localStorage.getItem("theme");
            if (savedTheme === "dark" || (!savedTheme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
                document.documentElement.classList.add("dark");
                document.getElementById("themeToggleBtn").textContent = "☀️";
            } else {
                document.documentElement.classList.remove("dark");
                document.getElementById("themeToggleBtn").textContent = "🌙";
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById("themeToggleBtn");
            if (html.classList.contains("dark")) {
                html.classList.remove("dark");
                localStorage.setItem("theme", "light");
                btn.textContent = "🌙";
            } else {
                html.classList.add("dark");
                localStorage.setItem("theme", "dark");
                btn.textContent = "☀️";
            }
        }

        async function ladeDaten() {
            const container = document.getElementById("shoppingListContainer");

            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const data = await response.json();
                
                aktualisiereMarktDropdown(data.markets);
                renderEinkaufsliste(data.items);
                
            } catch (error) {
                console.error("Fehler beim Laden:", error);
                container.innerHTML = `
                    <div class="bg-red-50 dark:bg-red-950/50 border border-red-200 dark:border-red-900 text-red-700 dark:text-red-300 p-4 rounded-xl text-sm">
                        ❌ Verbindung zum Server fehlgeschlagen. Bitte Internetverbindung prüfen.
                    </div>`;
            }
        }

        function aktualisiereMarktDropdown(markets) {
            const selectElement = document.getElementById("marketSelect");
            const currentSelection = selectElement.value;
            selectElement.options.length = 0;
            
            if (markets && markets.length > 0) {
                markets.forEach(market => {
                    const option = document.createElement("option");
                    option.value = market;
                    option.textContent = market;
                    selectElement.appendChild(option);
                });
            } else {
                const option = document.createElement("option");
                option.value = "Allgemein";
                option.textContent = "Allgemein";
                selectElement.appendChild(option);
            }

            if (currentSelection && Array.from(selectElement.options).some(o => o.value === currentSelection)) {
                selectElement.value = currentSelection;
            }
        }

        function renderEinkaufsliste(items) {
            const container = document.getElementById("shoppingListContainer");
            
            if (!items || items.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-400 py-8 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700">Die Einkaufsliste ist aktuell leer.</div>`;
                return;
            }

            container.innerHTML = "";
            
            items.forEach(item => {
                const isBought = item.bought === true || item.bought === "true";
                const div = document.createElement("div");
                div.className = `flex items-center justify-between p-3.5 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm transition ${isBought ? 'opacity-50 bg-slate-50 dark:bg-slate-800/50' : ''}`;
                
                div.innerHTML = `
                    <div class="flex items-center gap-3 flex-1 min-w-0">
                        <input type="checkbox" ${isBought ? 'checked' : ''} onchange="statusÄndern('${item.id}', this.checked)" class="w-5 h-5 accent-blue-600 rounded cursor-pointer">
                        <div class="min-w-0">
                            <p class="font-semibold text-slate-800 dark:text-slate-100 truncate ${isBought ? 'line-through text-slate-400 dark:text-slate-500' : ''}">${escapeHtml(item.text)}</p>
                            <div class="flex items-center gap-2 mt-0.5">
                                <span class="text-[11px] bg-blue-50 dark:bg-blue-950/50 text-blue-700 dark:text-blue-300 px-2 py-0.5 rounded-md font-semibold">📍 ${escapeHtml(item.category || 'Allgemein')}</span>
                                <span class="text-xs text-slate-400 dark:text-slate-500 font-medium">Menge: ${escapeHtml(item.quantity || '1')}</span>
                            </div>
                        </div>
                    </div>
                    <button onclick="loescheArtikel('${item.id}')" class="text-slate-300 dark:text-slate-600 hover:text-red-500 p-2 transition">
                        🗑️
                    </button>
                `;
                container.appendChild(div);
            });
        }

        async function artikelHinzufuegen() {
            const textInput = document.getElementById("itemText");
            const marketSelect = document.getElementById("marketSelect");
            const qtyInput = document.getElementById("itemQty");

            const text = textInput.value.trim();
            const category = marketSelect.value || "Allgemein";
            const quantity = qtyInput.value.trim() || "1";

            if (!text) {
                alert("Bitte gib einen Artikel ein.");
                return;
            }

            const newItem = {
                action: "add",
                id: 'id_' + Date.now(),
                text: text,
                category: category,
                quantity: quantity,
                bought: false
            };

            textInput.value = "";
            await sendeAnBackend(newItem);
        }

        async function statusÄndern(id, boughtStatus) {
            await sendeAnBackend({ action: "toggle", id: id, bought: boughtStatus });
        }

        async function loescheArtikel(id) {
            await sendeAnBackend({ action: "delete", id: id });
        }

        async function sendeAnBackend(payload) {
            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(payload)
                });
                
                setTimeout(() => {
                    ladeDaten();
                }, 700);

            } catch (error) {
                console.error("Fehler beim Speichern:", error);
                alert("Verbindungsfehler beim Speichern.");
            }
        }

        function sprachEingabeStarten() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Spracherkennung wird auf diesem Gerät/Browser leider nicht unterstützt.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'de-DE';
            recognition.interimResults = false;

            const micButton = document.getElementById("micButton");
            micButton.classList.add("bg-red-500", "text-white", "animate-pulse");
            micButton.textContent = "🔴 Höre zu...";

            recognition.onresult = function(event) {
                document.getElementById("itemText").value = event.results[0][0].transcript;
            };

            recognition.onend = function() {
                micButton.classList.remove("bg-red-500", "text-white", "animate-pulse");
                micButton.textContent = "🎤 Einsprechen";
            };

            recognition.start();
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
