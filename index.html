<!DOCTYPE html>

<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Familien-Einkaufsliste</title>

    <!-- Tailwind CSS -->

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#2563eb">

</head>

<body class="bg-slate-100 min-h-screen text-slate-800 font-sans antialiased">



    <div class="max-w-md mx-auto p-4 sm:p-6 pb-24">

        <!-- Header -->

        <header class="flex justify-between items-center mb-6">

            <div>

                <h1 class="text-2xl font-extrabold text-blue-600 tracking-tight">🛒 Einkaufsliste</h1>

                <p class="text-xs text-slate-500">Nach Märkten gebündelt &amp; mit Logos</p>

            </div>

            <div class="flex items-center gap-2">

                <span id="connectionBadge" class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block" title="Verbunden"></span>

                <button onclick="ladeDaten()" class="text-sm bg-white border border-slate-300 px-3 py-1.5 rounded-xl shadow-sm hover:bg-slate-50 active:scale-95 transition font-medium">

                    🔄 Laden

                </button>

            </div>

        </header>



        <!-- Eingabeformular -->

        <div class="bg-white p-4 rounded-2xl shadow-md border border-slate-100 mb-6 space-y-4">

            <div>

                <div class="flex justify-between items-center mb-1">

                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">Artikel</label>

                    <button onclick="sprachEingabeStarten()" id="micButton" type="button" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-lg transition flex items-center gap-1 font-semibold">

                        🎤 Einsprechen

                    </button>

                </div>

                <input type="text" id="itemText" placeholder="z. B. Milch, Brot, Äpfel..." class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800">

            </div>



            <div class="flex gap-3">

                <div class="flex-1">

                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Supermarkt</label>

                    <!-- Markt-Dropdown -->

                    <select id="marketSelect" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 font-medium">

                        <option value="">Lade Märkte...</option>

                    </select>

                </div>

                <div class="w-24">

                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Anzahl</label>

                    <input type="text" id="itemQty" value="1" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-center focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800">

                </div>

            </div>



            <button id="submitBtn" onclick="artikelHinzufuegen()" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-500/30 transition active:scale-95 flex items-center justify-center gap-2">

                <span>+ Artikel hinzufügen</span>

            </button>

        </div>



        <!-- Status & Filter -->

        <div id="statusInfo" class="hidden mb-3 text-xs text-center py-2 px-3 rounded-xl"></div>



        <!-- Einkaufsliste Anzeige (Gebündelt nach Markt mit Logos) -->

        <div id="shoppingListContainer" class="space-y-4">

            <div class="text-center text-slate-400 py-8 bg-white rounded-2xl border border-slate-200 shadow-sm">Lade Daten aus Google Sheets...</div>

        </div>

    </div>



    <!-- JavaScript Logik -->

    <script>

        // Deine hinterlegte Google Apps Script Web-App URL:

        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyraN51T7Olunfs830ukzQZZBxNcZJvgpg1T41sTHhnOy1k-2qtuLQJ31ezOQRBBui7/exec";



        window.addEventListener("DOMContentLoaded", () => {

            ladeDaten();

            

            // Enter-Taste im Textfeld zum Abschicken nutzen

            document.getElementById("itemText").addEventListener("keypress", (e) => {

                if (e.key === "Enter") artikelHinzufuegen();

            });

            document.getElementById("itemQty").addEventListener("keypress", (e) => {

                if (e.key === "Enter") artikelHinzufuegen();

            });

        });



        async function ladeDaten() {

            const container = document.getElementById("shoppingListContainer");

            const badge = document.getElementById("connectionBadge");



            try {

                const response = await fetch(APPS_SCRIPT_URL);

                const data = await response.json();

                

                badge.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block";

                badge.title = "Verbunden";



                // 1. Markt-Dropdown füllen

                aktualisiereMarktDropdown(data.markets);

                

                // 2. Einkaufsliste nach Markt gruppiert mit Logos anzeigen

                renderEinkaufsliste(data.items, data.markets);

                

            } catch (error) {

                console.error("Fehler beim Laden:", error);

                badge.className = "w-2.5 h-2.5 rounded-full bg-rose-500 inline-block animate-pulse";

                badge.title = "Verbindungshinweis / Offline";

                

                container.innerHTML = `

                    <div class="bg-amber-50 border border-amber-200 text-amber-800 p-4 rounded-xl text-sm shadow-sm">

                        ⚠️ Verbindung zum Server konnte nicht hergestellt werden. Bitte prüfe deine Internetverbindung.

                    </div>`;

            }

        }



        function aktualisiereMarktDropdown(markets) {

            const selectElement = document.getElementById("marketSelect");

            const currentSelection = selectElement.value;

            selectElement.innerHTML = "";

            

            if (markets && markets.length > 0) {

                markets.forEach(market => {

                    const option = document.createElement("option");

                    option.value = market;

                    option.textContent = market;

                    selectElement.appendChild(option);

                });

            } else {

                const option = document.createElement("option");

                option.value = "Allgemein";

                option.textContent = "Allgemein";

                selectElement.appendChild(option);

            }



            if (currentSelection && Array.from(selectElement.options).some(o => o.value === currentSelection)) {

                selectElement.value = currentSelection;

            }

        }



        function getMarketBadge(marketName) {

            const name = marketName.toLowerCase().trim();

            

            if (name.includes('rewe')) {

                return `<div class="w-7 h-7 rounded-lg bg-red-600 text-white flex items-center justify-center font-black text-xs shadow-sm">R</div>`;

            } else if (name.includes('aldi')) {

                return `<div class="w-7 h-7 rounded-lg bg-blue-600 text-white flex items-center justify-center font-black text-xs shadow-sm">A</div>`;

            } else if (name.includes('edeka')) {

                return `<div class="w-7 h-7 rounded-lg bg-yellow-400 text-blue-900 flex items-center justify-center font-black text-xs shadow-sm">E</div>`;

            } else if (name.includes('dm')) {

                return `<div class="w-7 h-7 rounded-lg bg-purple-600 text-white flex items-center justify-center font-black text-xs shadow-sm">dm</div>`;

            } else if (name.includes('lidl')) {

                return `<div class="w-7 h-7 rounded-lg bg-blue-700 text-yellow-400 flex items-center justify-center font-black text-xs shadow-sm">L</div>`;

            } else if (name.includes('netto')) {

                return `<div class="w-7 h-7 rounded-lg bg-yellow-500 text-red-600 flex items-center justify-center font-black text-xs shadow-sm">N</div>`;

            } else if (name.includes('kaufland')) {

                return `<div class="w-7 h-7 rounded-lg bg-red-700 text-white flex items-center justify-center font-black text-xs shadow-sm">K</div>`;

            }

            

            // Standard-Fallback für andere oder allgemeine Märkte

            return `<div class="w-7 h-7 rounded-lg bg-slate-200 text-slate-600 flex items-center justify-center text-xs shadow-sm">🛒</div>`;

        }



        function renderEinkaufsliste(items, markets) {

            const container = document.getElementById("shoppingListContainer");

            

            if (!items || items.length === 0) {

                container.innerHTML = `<div class="text-center text-slate-400 py-8 bg-white rounded-2xl border border-slate-200 shadow-sm">Die Einkaufsliste ist aktuell leer. Genial! 🎉</div>`;

                return;

            }



            // Artikel nach Kategorie / Supermarkt gruppieren

            const grouped = {};

            items.forEach(item => {

                const cat = item.category && item.category.trim() !== "" ? item.category : "Allgemein";

                if (!grouped[cat]) {

                    grouped[cat] = [];

                }

                grouped[cat].push(item);

            });



            // Märkte sortieren (falls in 'markets' definiert, sonst alphabetisch)

            let sortedKeys = Object.keys(grouped);

            if (markets && markets.length > 0) {

                sortedKeys.sort((a, b) => {

                    let indexA = markets.indexOf(a);

                    let indexB = markets.indexOf(b);

                    if (indexA === -1) indexA = 999;

                    if (indexB === -1) indexB = 999;

                    return indexA - indexB;

                });

            }



            container.innerHTML = "";



            // Für jede Kategorie eine Sektion (Markt-Gruppe) erzeugen

            sortedKeys.forEach(market => {

                const marketItems = grouped[market];

                

                const sectionDiv = document.createElement("div");

                sectionDiv.className = "bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden mb-3";

                

                // Markt-Header mit Logo-Badge

                let headerHtml = `

                    <div class="bg-slate-50 px-4 py-2.5 border-b border-slate-200 flex justify-between items-center">

                        <div class="flex items-center gap-2.5">

                            ${getMarketBadge(market)}

                            <span class="font-bold text-slate-700 text-sm">

                                ${escapeHtml(market)}

                            </span>

                        </div>

                        <span class="text-xs bg-blue-100 text-blue-700 font-semibold px-2 py-0.5 rounded-full">

                            ${marketItems.length} ${marketItems.length === 1 ? 'Artikel' : 'Artikel'}

                        </span>

                    </div>

                `;



                // Artikel-Liste innerhalb dieses Marktes

                let itemsHtml = '<div class="divide-y divide-slate-100">';

                marketItems.forEach(item => {

                    const isBought = item.bought === true || item.bought === "true";

                    itemsHtml += `

                        <div class="flex items-center justify-between p-3.5 transition ${isBought ? 'opacity-50 bg-slate-50/60' : 'hover:bg-slate-50/40'}">

                            <div class="flex items-center gap-3 flex-1 min-w-0">

                                <input type="checkbox" ${isBought ? 'checked' : ''} onchange="statusÄndern('${item.id}', this.checked)" class="w-5 h-5 accent-blue-600 rounded cursor-pointer">

                                <div class="min-w-0">

                                    <p class="font-semibold text-slate-800 truncate ${isBought ? 'line-through text-slate-400' : ''}">${escapeHtml(item.text)}</p>

                                    <div class="flex items-center gap-2 mt-0.5">

                                        <span class="text-xs text-slate-400 font-medium">Menge: ${escapeHtml(item.quantity || '1')}</span>

                                    </div>

                                </div>

                            </div>

                            <button onclick="loescheArtikel('${item.id}')" class="text-slate-300 hover:text-red-500 p-2 transition">

                                🗑️

                            </button>

                        </div>

                    `;

                });

                itemsHtml += '</div>';



                sectionDiv.innerHTML = headerHtml + itemsHtml;

                container.appendChild(sectionDiv);

            });

        }



        async function artikelHinzufuegen() {

            const textInput = document.getElementById("itemText");

            const marketSelect = document.getElementById("marketSelect");

            const qtyInput = document.getElementById("itemQty");

            const submitBtn = document.getElementById("submitBtn");



            const text = textInput.value.trim();

            const category = marketSelect.value || "Allgemein";

            const quantity = qtyInput.value.trim() || "1";



            if (!text) {

                alert("Bitte gib einen Artikel ein.");

                return;

            }



            const newItem = {

                action: "add",

                id: 'id_' + Date.now(),

                text: text,

                category: category,

                quantity: quantity,

                bought: false

            };



            textInput.value = "";

            submitBtn.disabled = true;

            submitBtn.innerHTML = `<span class="animate-spin">⏳</span> Speichere...`;



            await sendeAnBackend(newItem);

            

            submitBtn.disabled = false;

            submitBtn.innerHTML = `<span>+ Artikel hinzufügen</span>`;

        }



        async function statusÄndern(id, boughtStatus) {

            await sendeAnBackend({ action: "toggle", id: id, bought: boughtStatus });

        }



        async function loescheArtikel(id) {

            await sendeAnBackend({ action: "delete", id: id });

        }



        async function sendeAnBackend(payload) {

            try {

                await fetch(APPS_SCRIPT_URL, {

                    method: "POST",

                    mode: "no-cors",

                    headers: { "Content-Type": "text/plain" },

                    body: JSON.stringify(payload)

                });

                

                setTimeout(() => {

                    ladeDaten();

                }, 600);



            } catch (error) {

                console.error("Fehler beim Speichern:", error);

                alert("Verbindungsfehler beim Speichern.");

            }

        }



        function sprachEingabeStarten() {

            TheSpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!TheSpeechRecognition) {

                alert("Spracherkennung wird auf diesem Gerät/Browser leider nicht unterstützt.");

                return;

            }



            const recognition = new TheSpeechRecognition();

            recognition.lang = 'de-DE';

            recognition.interimResults = false;



            const micButton = document.getElementById("micButton");

            micButton.classList.add("bg-red-500", "text-white", "animate-pulse");

            micButton.textContent = "🔴 Höre zu...";



            recognition.onresult = function(event) {

                document.getElementById("itemText").value = event.results[0][0].transcript;

            };



            recognition.onend = function() {

                micButton.classList.remove("bg-red-500", "text-white", "animate-pulse");

                micButton.textContent = "🎤 Einsprechen";

            };



            recognition.start();

        }



        function escapeHtml(str) {

            return String(str)

                .replace(/&/g, '&amp;')

                .replace(/</g, '&lt;')

                .replace(/>/g, '&gt;')

                .replace(/"/g, '&quot;');

        }

    </script>

</body>

</html>
