<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einkaufsliste PWA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-20">

    <div class="max-w-md mx-auto p-4">
        <!-- Header -->
        <header class="mb-6 mt-2 flex justify-between items-center">
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">Einkaufsliste</h1>
            <button onclick="loadData()" class="text-xs bg-slate-200 hover:bg-slate-300 px-3 py-1.5 rounded-full font-medium transition">Aktualisieren</button>
        </header>

        <!-- Eingabeformular -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 mb-6">
            <form id="addForm" onsubmit="addItem(event)" class="space-y-3">
                <div>
                    <input type="text" id="itemName" placeholder="Neuer Artikel (z.B. Milch)..." required
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <div class="flex gap-2">
                    <select id="itemMarket" class="flex-1 px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="Allgemein">Allgemein</option>
                    </select>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl font-semibold text-sm shadow-sm transition">
                        Hinzufügen
                    </button>
                </div>
            </form>
        </div>

        <!-- Einkaufsliste -->
        <div id="shoppingList" class="space-y-4">
            <div class="text-center py-10 text-slate-400 text-sm">Lade Daten...</div>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyraN51T7Olunfs830ukzQZZBxNcZJvgpg1T41sTHhnOy1k-2qtuLQJ31ezOQRBBui7/exec";
        
        let allItems = [];
        let marketDataMap = {};

        // Übersetzungstabelle für deutsche Farbnamen
        function resolveColor(colorName, type = 'bg') {
            if (!colorName) return type === 'bg' ? '#94a3b8' : (type === 'text' ? '#ffffff' : '#f1f5f9');
            const c = String(colorName).toLowerCase().trim();
            
            const colorTable = {
                'gelb':        { bg: '#facc15', text: '#1e3a8a', light: '#fef08a' },
                'blau':        { bg: '#2563eb', text: '#ffffff', light: '#dbeafe' },
                'hellblau':    { bg: '#38bdf8', text: '#0f172a', light: '#e0f2fe' },
                'grau':        { bg: '#94a3b8', text: '#ffffff', light: '#f1f5f9' },
                'dunkelgrau':  { bg: '#334155', text: '#ffffff', light: '#e2e8f0' },
                'rot':         { bg: '#dc2626', text: '#ffffff', light: '#fee2e2' },
                'orange':      { bg: '#f97316', text: '#ffffff', light: '#ffedd5' },
                'weiss':       { bg: '#ffffff', text: '#0f172a', light: '#f8fafc' },
                'weiß':        { bg: '#ffffff', text: '#0f172a', light: '#f8fafc' }
            };

            if (colorTable[c]) {
                return colorTable[c][type];
            }
            return c; // Fallback, falls Hexcode eingetragen wurde
        }

        async function loadData() {
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const data = await response.json();
                
                // 1. Märkte verarbeiten
                marketDataMap = {};
                const marketSelect = document.getElementById('itemMarket');
                const selectedVal = marketSelect.value;
                marketSelect.innerHTML = '';

                if (data.markets && data.markets.length > 0) {
                    data.markets.forEach(m => {
                        const mKey = m.name.toLowerCase().trim();
                        marketDataMap[mKey] = {
                            bg: resolveColor(m.bgColor, 'bg'),
                            text: resolveColor(m.textColor, 'text'),
                            light: resolveColor(m.bgColor, 'light')
                        };

                        const opt = document.createElement('option');
                        opt.value = m.name;
                        opt.textContent = m.name;
                        marketSelect.appendChild(opt);
                    });
                } else {
                    const opt = document.createElement('option');
                    opt.value = "Allgemein";
                    opt.textContent = "Allgemein";
                    marketSelect.appendChild(opt);
                }
                
                if (selectedVal && Array.from(marketSelect.options).some(o => o.value === selectedVal)) {
                    marketSelect.value = selectedVal;
                }

                // 2. Artikel verarbeiten (Sicherstellen, dass Name existiert)
                allItems = (data.items || []).map(item => ({
                    id: item.id || 'id_' + Math.random(),
                    name: item.name || item.title || item.artikel || "Unbenannter Artikel",
                    market: item.market || "Allgemein",
                    checked: !!item.checked
                }));

                renderUI();
            } catch (err) {
                console.error("Fehler beim Laden:", err);
                document.getElementById('shoppingList').innerHTML = `<div class="text-center py-6 text-red-500 text-sm">Fehler beim Verbinden mit dem Server.</div>`;
            }
        }

        function renderUI() {
            const container = document.getElementById('shoppingList');
            container.innerHTML = '';

            if (allItems.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400 text-sm bg-white rounded-2xl border border-slate-100">Keine Artikel auf der Liste.</div>`;
                return;
            }

            // Nach Märkten gruppieren
            const groups = {};
            allItems.forEach(item => {
                const m = item.market || "Allgemein";
                if (!groups[m]) groups[m] = [];
                groups[m].push(item);
            });

            for (const [marketName, items] of Object.entries(groups)) {
                const mKey = marketName.toLowerCase().trim();
                const mStyle = marketDataMap[mKey] || { bg: '#94a3b8', text: '#ffffff', light: '#f1f5f9' };

                const groupDiv = document.createElement('div');
                groupDiv.className = 'bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden mb-4';
                
                // Header mit Farb-Badge & hellem Hintergrund
                const headerHtml = `
                    <div class="px-4 py-3 flex items-center justify-between border-b border-slate-100" style="background-color: ${mStyle.light};">
                        <div class="flex items-center gap-2.5">
                            <div class="w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs shadow-sm" style="background-color: ${mStyle.bg}; color: ${mStyle.text};">
                                ${marketName.charAt(0).toUpperCase()}
                            </div>
                            <h2 class="font-bold text-sm tracking-wide text-slate-800">${escapeHtml(marketName)}</h2>
                        </div>
                        <span class="text-xs font-semibold px-2.5 py-1 bg-white/80 rounded-full text-slate-600 shadow-xs">${items.length}</span>
                    </div>
                `;

                const itemsList = document.createElement('div');
                itemsList.className = 'divide-y divide-slate-50';

                items.forEach(item => {
                    const row = document.createElement('div');
                    row.className = `p-3.5 flex items-center justify-between transition ${item.checked ? 'bg-slate-50/60 opacity-60' : 'hover:bg-slate-50/40'}`;
                    
                    row.innerHTML = `
                        <div class="flex items-center gap-3 flex-1 cursor-pointer" onclick="toggleItem('${escapeHtml(item.id)}')">
                            <input type="checkbox" ${item.checked ? 'checked' : ''} class="w-5 h-5 rounded-md text-indigo-600 focus:ring-indigo-500 border-slate-300 cursor-pointer">
                            <span class="text-sm font-medium ${item.checked ? 'line-through text-slate-400' : 'text-slate-700'}">${escapeHtml(item.name)}</span>
                        </div>
                        <button onclick="deleteItem('${escapeHtml(item.id)}')" class="text-slate-300 hover:text-red-500 p-1.5 transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    `;
                    itemsList.appendChild(row);
                });

                groupDiv.innerHTML = headerHtml;
                groupDiv.appendChild(itemsList);
                container.appendChild(groupDiv);
            }
        }

        function addItem(e) {
            e.preventDefault();
            const nameInput = document.getElementById('itemName');
            const marketInput = document.getElementById('itemMarket');
            
            const newItem = {
                id: 'id_' + Date.now(),
                name: nameInput.value.trim(),
                market: marketInput.value,
                checked: false
            };

            allItems.unshift(newItem);
            nameInput.value = '';
            renderUI();

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'add', ...newItem })
            });
        }

        function toggleItem(id) {
            const item = allItems.find(i => i.id === id);
            if (item) {
                item.checked = !item.checked;
                renderUI();

                fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'toggle', id: id, name: item.name, market: item.market })
                });
            }
        }

        function deleteItem(id) {
            const item = allItems.find(i => i.id === id);
            allItems = allItems.filter(i => i.id !== id);
            renderUI();

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'delete', id: id, name: item ? item.name : '', market: item ? item.market : '' })
            });
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        loadData();
    </script>
</body>
</html>
