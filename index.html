<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familien-Einkaufsliste (Google Sheets Sync)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome für Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="https://placehold.co/192x192/4f46e5/ffffff?text=🛒">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col antialiased">

    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-10">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-500 p-2.5 rounded-xl shadow-inner">
                    <i class="fa-solid fa-basket-shopping text-xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-tight">Familien-Einkauf</h1>
                    <p class="text-xs text-indigo-200 flex items-center gap-1">
                        <span id="syncStatusPunkt" class="w-2 h-2 rounded-full bg-amber-400 inline-block"></span> 
                        <span id="syncStatusText">Verbinde mit Sheets...</span>
                    </p>
                </div>
            </div>
            <button onclick="oeffneInfoModal()" class="bg-indigo-500 hover:bg-indigo-400 p-2.5 rounded-xl text-white transition active:scale-95">
                <i class="fa-solid fa-gear text-sm"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-28 overflow-y-auto space-y-4">
        
        <!-- Eingabebereich für neue Artikel -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
            <form id="artikelForm" onsubmit="fuegeArtikelHinzu(event)" class="space-y-3">
                <div>
                    <label for="artikelName" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Neues Produkt</label>
                    <div class="flex space-x-2">
                        <input type="text" id="artikelName" placeholder="z.B. Bio-Milch, Äpfel..." required
                            class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 rounded-xl font-medium text-sm shadow-sm shadow-indigo-200 transition active:scale-95 flex items-center justify-center">
                            <i class="fa-solid fa-plus mr-1"></i> Hinzufügen
                        </button>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <select id="artikelKategorie" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="Obst & Gemüse">🍎 Obst & Gemüse</option>
                            <option value="Kühlregal & Milch">🥛 Kühlregal & Milch</option>
                            <option value="Bäckerei">🥖 Bäckerei</option>
                            <option value="Getränke">🥤 Getränke</option>
                            <option value="Haushalt & Drogerie">🧼 Haushalt & Drogerie</option>
                            <option value="Sonstiges">📦 Sonstiges</option>
                        </select>
                    </div>
                    <div>
                        <input type="number" id="artikelMenge" value="1" min="1" max="99" 
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Anzahl">
                    </div>
                </div>
            </form>
        </section>

        <!-- Filter- und Suchleiste -->
        <div class="flex items-center justify-between text-xs text-slate-500 px-1">
            <span id="zaehlerStatistik">0 offene Artikel</span>
            <div class="space-x-3">
                <button onclick="ladeDatenVonSheets()" class="text-indigo-600 hover:underline font-medium"><i class="fa-solid fa-rotate mr-1"></i>Synchronisieren</button>
                <button onclick="loescheErledigte()" class="text-rose-500 hover:underline font-medium">Erledigte löschen</button>
            </div>
        </div>

        <!-- Kategorisierte Listen-Container -->
        <div id="listenContainer" class="space-y-4"></div>

        <!-- Leerstand-Hinweis -->
        <div id="leererZustand" class="hidden text-center py-12">
            <div class="text-slate-300 text-4xl mb-3"><i class="fa-solid fa-cart-shopping"></i></div>
            <p class="text-sm font-medium text-slate-400">Deine Einkaufsliste ist leer.</p>
            <p class="text-xs text-slate-400 mt-1">Füge oben neue Artikel hinzu!</p>
        </div>

    </main>

    <nav class="bg-white border-t border-slate-100 py-3 px-4 fixed bottom-0 left-0 right-0 shadow-lg">
        <div class="max-w-md mx-auto flex justify-around text-xs font-medium text-slate-500">
            <button onclick="filterAnsicht('alle')" id="btnAlle" class="flex flex-col items-center text-indigo-600 transition">
                <i class="fa-solid fa-list text-base mb-1"></i> Alle
            </button>
            <button onclick="filterAnsicht('offen')" id="btnOffen" class="flex flex-col items-center hover:text-indigo-600 transition">
                <i class="fa-solid fa-basket-shopping text-base mb-1"></i> Offen
            </button>
            <button onclick="filterAnsicht('erledigt')" id="btnErledigt" class="flex flex-col items-center hover:text-indigo-600 transition">
                <i class="fa-solid fa-circle-check text-base mb-1"></i> Erledigt
            </button>
        </div>
    </nav>

    <div id="infoModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-slate-800 text-base">Google Sheets Anbindung</h3>
                <button onclick="schliesseInfoModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <p class="text-xs text-slate-600 leading-relaxed">
                Deine Web-App-URL ist fest hinterlegt. Du kannst sie hier bei Bedarf einsehen oder ändern:
            </p>
            <div>
                <label for="scriptUrlInput" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Apps Script Web-URL</label>
                <input type="text" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/.../exec"
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button onclick="speichereScriptUrl()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-medium text-xs transition">
                Speichern & Verbinden
            </button>
        </div>
    </div>

    <script>
        // Feste Integration deiner Web-App-URL als Standard
        let googleScriptUrl = localStorage.getItem('google_script_url') || 'https://script.google.com/macros/s/AKfycbxDMU3SRex-kTR6c1XBHS5PyDejCK_sa4hqst4VO6sbeKCAkvmufBdq1w1-eKY7ZlAw/exec';
        
        let einkaufsliste = JSON.parse(localStorage.getItem('familie_einkaufsliste_sheets')) || [
            { id: 1, name: 'Vollmilch 1,5%', kategorie: 'Kühlregal & Milch', menge: 2, erledigt: false },
            { id: 2, name: 'Äpfel (Braeburn)', kategorie: 'Obst & Gemüse', menge: 5, erledigt: false }
        ];

        let aktuellerFilter = 'alle';

        window.onload = function() {
            document.getElementById('scriptUrlInput').value = googleScriptUrl;
            renderListe();
            ladeDatenVonSheets();
        };

        function speichereScriptUrl() {
            const url = document.getElementById('scriptUrlInput').value.trim();
            googleScriptUrl = url;
            localStorage.setItem('google_script_url', url);
            schliesseInfoModal();
            if (url) ladeDatenVonSheets();
        }

        async function ladeDatenVonSheets() {
            if (!googleScriptUrl) return;
            setSyncStatus('Lade...', 'bg-amber-400');
            try {
                const response = await fetch(googleScriptUrl);
                const data = await response.json();
                if (Array.isArray(data)) {
                    einkaufsliste = data;
                    speichereLokal();
                    setSyncStatus('Verbunden (Google Sheets)', 'bg-emerald-500');
                    renderListe();
                }
            } catch (error) {
                console.error('Fehler beim Laden:', error);
                setSyncStatus('Offline / Fehler', 'bg-rose-500');
            }
        }

        async function sendeAenderungAnSheets() {
            if (!googleScriptUrl) return;
            setSyncStatus('Speichere...', 'bg-amber-400');
            try {
                await fetch(googleScriptUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(einkaufsliste)
                });
                setSyncStatus('Verbunden (Google Sheets)', 'bg-emerald-500');
            } catch (error) {
                console.error('Fehler beim Senden:', error);
                setSyncStatus('Speichern fehlgeschlagen', 'bg-rose-500');
            }
        }

        function setSyncStatus(text, colorClass) {
            document.getElementById('syncStatusText').textContent = text;
            document.getElementById('syncStatusPunkt').className = `w-2 h-2 rounded-full inline-block ${colorClass}`;
        }

        function fuegeArtikelHinzu(event) {
            event.preventDefault();
            const nameInput = document.getElementById('artikelName');
            const kategorieInput = document.getElementById('artikelKategorie');
            const mengeInput = document.getElementById('artikelMenge');

            const neuerEintrag = {
                id: Date.now(),
                name: nameInput.value.trim(),
                kategorie: kategorieInput.value,
                menge: parseInt(mengeInput.value) || 1,
                erledigt: false
            };

            einkaufsliste.unshift(neuerEintrag);
            speichereUndRendere();

            nameInput.value = '';
            mengeInput.value = '1';
            nameInput.focus();
        }

        function schalteStatus(id) {
            const artikel = einkaufsliste.find(item => item.id === id);
            if (artikel) {
                artikel.erledigt = !artikel.erledigt;
                speichereUndRendere();
            }
        }

        function loescheArtikel(id) {
            einkaufsliste = einkaufsliste.filter(item => item.id !== id);
            speichereUndRendere();
        }

        function loescheErledigte() {
            einkaufsliste = einkaufsliste.filter(item => !item.erledigt);
            speichereUndRendere();
        }

        function filterAnsicht(typ) {
            aktuellerFilter = typ;
            document.getElementById('btnAlle').className = `flex flex-col items-center transition ${typ === 'alle' ? 'text-indigo-600' : 'hover:text-indigo-600'}`;
            document.getElementById('btnOffen').className = `flex flex-col items-center transition ${typ === 'offen' ? 'text-indigo-600' : 'hover:text-indigo-600'}`;
            document.getElementById('btnErledigt').className = `flex flex-col items-center transition ${typ === 'erledigt' ? 'text-indigo-600' : 'hover:text-indigo-600'}`;
            renderListe();
        }

        function speichereLokal() {
            localStorage.setItem('familie_einkaufsliste_sheets', JSON.stringify(einkaufsliste));
        }

        function speichereUndRendere() {
            speichereLokal();
            renderListe();
            sendeAenderungAnSheets();
        }

        function renderListe() {
            const container = document.getElementById('listenContainer');
            const leererZustand = document.getElementById('leererZustand');
            const zaehlerStatistik = document.getElementById('zaehlerStatistik');
            container.innerHTML = '';

            let gefiltert = einkaufsliste.filter(item => {
                if (aktuellerFilter === 'offen') return !item.erledigt;
                if (aktuellerFilter === 'erledigt') return item.erledigt;
                return true;
            });

            const offeneAnzahl = einkaufsliste.filter(i => !i.erledigt).length;
            zaehlerStatistik.textContent = `${offeneAnzahl} offene Artikel`;

            if (gefiltert.length === 0) {
                leererZustand.classList.remove('hidden');
                return;
            } else {
                leererZustand.classList.add('hidden');
            }

            const kategorienMap = {};
            gefiltert.forEach(item => {
                if (!kategorienMap[item.kategorie]) {
                    kategorienMap[item.kategorie] = [];
                }
                kategorienMap[item.kategorie].push(item);
            });

            for (const [kategorie, items] of Object.entries(kategorienMap)) {
                const kartenDiv = document.createElement('div');
                kartenDiv.className = 'bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-2';

                let htmlContent = `<div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">${kategorie}</div>`;
                htmlContent += `<div class="space-y-2">`;

                items.forEach(item => {
                    htmlContent += `
                        <div class="flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-50 transition border border-transparent hover:border-slate-100 group">
                            <div class="flex items-center space-x-3 flex-1 cursor-pointer" onclick="schalteStatus(${item.id})">
                                <div class="w-6 h-6 rounded-lg border-2 flex items-center justify-center transition ${item.erledigt ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 bg-white'}">
                                    ${item.erledigt ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                                </div>
                                <div class="flex items-baseline space-x-2">
                                    <span class="text-sm font-medium ${item.erledigt ? 'line-through text-slate-400' : 'text-slate-700'}">${item.name}</span>
                                    ${item.menge > 1 ? `<span class="text-xs font-semibold bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded-md">x${item.menge}</span>` : ''}
                                </div>
                            </div>
                            <button onclick="loescheArtikel(${item.id})" class="text-slate-300 hover:text-rose-500 p-1 rounded-lg transition">
                                <i class="fa-solid fa-trash-can text-sm"></i>
                            </button>
                        </div>
                    `;
                });

                htmlContent += `</div>`;
                kartenDiv.innerHTML = htmlContent;
                container.appendChild(kartenDiv);
            }
        }

        function oeffneInfoModal() {
            document.getElementById('infoModal').classList.remove('hidden');
        }

        function schliesseInfoModal() {
            document.getElementById('infoModal').classList.add('hidden');
        }
    </script>
</body>
</html>
