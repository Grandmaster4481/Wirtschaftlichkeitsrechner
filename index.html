<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familien-Einkauf</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-100 h-full flex flex-col">
    <header class="bg-indigo-600 text-white shadow-md p-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-basket-shopping text-2xl"></i>
            <h1 class="text-xl font-bold">Familien-Einkauf</h1>
        </div>
        <div id="sync-status" class="text-xs bg-emerald-500 text-white px-2 py-1 rounded-full flex items-center space-x-1">
            <span class="w-2 h-2 bg-white rounded-full animate-pulse"></span>
            <span>Verbunden (Google Sheets)</span>
        </div>
    </header>

    <main class="flex-1 max-w-lg w-full mx-auto p-4 flex flex-col space-y-4 overflow-y-auto">
        <!-- Eingabebereich -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">Neues Produkt</label>
            <input type="text" id="item-input" placeholder="z.B. Milch, Äpfel..." class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <div class="grid grid-cols-2 gap-2">
                <select id="category-input" class="px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    <option value="Obst & Gemüse">🍎 Obst & Gemüse</option>
                    <option value="Kühlregal">🧀 Kühlregal</option>
                    <option value="Getränke">🥤 Getränke</option>
                    <option value="Drogerie">🧴 Drogerie</option>
                    <option value="Sonstiges">🛒 Sonstiges</option>
                </select>
                <input type="number" id="quantity-input" value="1" min="1" class="px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            </div>
            <button onclick="addItem()" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition">
                <i class="fa-solid fa-plus mr-1"></i> Hinzufügen
            </button>
        </div>

        <div class="flex justify-between items-center text-sm text-slate-600 px-1">
            <span id="item-count">0 offene Artikel</span>
            <div class="space-x-3">
                <button onclick="loadFromCloud()" class="text-indigo-600 hover:underline"><i class="fa-solid fa-rotate mr-1"></i>Synchronisieren</button>
                <button onclick="clearBought()" class="text-rose-600 hover:underline">Erledigte löschen</button>
            </div>
        </div>

        <!-- Listenbereich -->
        <div id="list-container" class="space-y-4"></div>
    </main>

    <script>
        // HIER DEINE GANZ FRISCH KOPIERTE WEB-APP-URL EINTRAGEN:
        const API_URL = "https://script.google.com/macros/s/AKfycbxDMU3SRex-kTR6c1XBHS5PyDejCK_sa4hqst4VO6sbeKCAkvmufBdq1w1-eKY7ZlAw/exec";
        let items = [];

        async function loadFromCloud() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                if (Array.isArray(data)) {
                    items = data
                        .filter(i => i && (i.text || i[1])) // Leere/ungültige Zeilen filtern
                        .map(i => ({
                            id: i.id || i[0] || String(Math.random()),
                            text: i.text || i[1] || "Unbekannter Artikel",
                            category: i.category || i[2] || "Sonstiges",
                            quantity: i.quantity || i[3] || 1,
                            bought: String(i.bought ?? i[4]) === "true" || i.bought === true || i[4] === true
                        }));
                    render();
                }
            } catch (e) {
                console.error("Ladefehler:", e);
            }
        }

        async function saveToCloud() {
            try {
                await fetch(API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(items)
                });
            } catch (e) {
                console.error("Speicherfehler:", e);
            }
        }

        function addItem() {
            const input = document.getElementById("item-input");
            const catInput = document.getElementById("category-input");
            const qtyInput = document.getElementById("quantity-input");
            
            const text = input.value.trim();
            if (!text) return;

            items.push({
                id: Date.now().toString(),
                text: text,
                category: catInput.value || "Sonstiges",
                quantity: qtyInput.value || 1,
                bought: false
            });

            input.value = "";
            qtyInput.value = "1";
            render();
            saveToCloud();
        }

        function toggleItem(id) {
            const item = items.find(i => i.id == id);
            if (item) {
                item.bought = !item.bought;
                render();
                saveToCloud();
            }
        }

        function deleteItem(id) {
            items = items.filter(i => i.id != id);
            render();
            saveToCloud();
        }

        function clearBought() {
            items = items.filter(i => !i.bought);
            render();
            saveToCloud();
        }

        function render() {
            const container = document.getElementById("list-container");
            container.innerHTML = "";

            const openCount = items.filter(i => !i.bought).length;
            document.getElementById("item-count").innerText = `${openCount} offene Artikel`;

            const categories = [...new Set(items.map(i => i.category || "Sonstiges"))];

            if (categories.length === 0 || items.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400">Keine Artikel auf der Liste.</div>`;
                return;
            }

            categories.forEach(cat => {
                const catItems = items.filter(i => (i.category || "Sonstiges") === cat);
                if (catItems.length === 0) return;

                let html = `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-slate-50 px-4 py-2 border-b border-slate-200 font-semibold text-xs text-slate-600 uppercase tracking-wider">${cat}</div>
                        <div class="divide-y divide-slate-100">
                `;

                catItems.forEach(item => {
                    html += `
                        <div class="flex items-center justify-between p-3 hover:bg-slate-50 transition">
                            <label class="flex items-center space-x-3 flex-1 cursor-pointer">
                                <input type="checkbox" ${item.bought ? 'checked' : ''} onchange="toggleItem('${item.id}')" class="w-5 h-5 text-indigo-600 rounded">
                                <span class="${item.bought ? 'line-through text-slate-400' : 'text-slate-800'} font-medium">
                                    ${item.text} <span class="text-xs text-slate-400 font-normal">(${item.quantity})</span>
                                </span>
                            </label>
                            <button onclick="deleteItem('${item.id}')" class="text-slate-400 hover:text-rose-600 p-2"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                });

                html += `</div></div>`;
                container.innerHTML += html;
            });
        }

        loadFromCloud();
        setInterval(loadFromCloud, 5000); // Live-Polling alle 5 Sekunden
    </script>
</body>
</html>
