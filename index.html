<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Familien Einkaufsliste</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full transition-colors duration-200">

  <div class="max-w-md mx-auto p-4 pb-20">
    
    <!-- Header -->
    <header class="flex items-center justify-between mb-6 pt-2">
      <div class="flex items-center gap-2">
        <span class="text-3xl">🛒</span>
        <div>
          <h1 class="text-xl font-bold leading-tight">Einkaufsliste</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">Gemeinsam organisiert</p>
        </div>
      </div>
      
      <!-- Theme Toggle Button -->
      <button id="themeToggle" onclick="toggleTheme()" class="p-2.5 rounded-full bg-white dark:bg-slate-800 shadow-sm border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 active:scale-95 transition-transform">
        <span id="themeIcon" class="text-lg">🌙</span>
      </button>
    </header>

    <!-- Formular zum Hinzufügen -->
    <form id="addForm" onsubmit="addItem(event)" class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 mb-6 space-y-3">
      
      <!-- Artikel Name & Sprachsteuerung -->
      <div class="relative">
        <input type="text" id="itemName" placeholder="Artikel hinzufügen..." required
               class="w-full pl-4 pr-10 py-3 rounded-xl bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>

      <!-- Parameter: Menge, Markt, Person -->
      <div class="grid grid-cols-12 gap-2">
        <!-- Menge -->
        <input type="text" id="itemQuantity" placeholder="Menge" value="1"
               class="col-span-3 px-3 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm text-center">

        <!-- Markt Dropdown -->
        <select id="itemMarket" class="col-span-5 px-3 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
          <option value="Allgemein">Allgemein</option>
        </select>

        <!-- Person Dropdown -->
        <select id="itemUser" onchange="saveSelectedUser(this.value)" class="col-span-4 px-3 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium">
          <option value="">Wer?</option>
        </select>
      </div>

      <!-- Hinzufügen Button -->
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium py-3 rounded-xl shadow-sm transition-colors text-sm flex items-center justify-center gap-2">
        <span>+ Artikel hinzufügen</span>
      </button>
    </form>

    <!-- Sync-Status -->
    <div id="status" class="text-xs text-center mb-4 text-slate-400 min-h-[1rem]">Lade Daten...</div>

    <!-- Artikel Liste nach Märkten -->
    <div id="itemList" class="space-y-6"></div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyraN51T7Olunfs830ukzQZZBxNcZJvgpg1T41sTHhnOy1k-2qtuLQJ31ezOQRBBui7/exec";

    let state = {
      items: [],
      markets: [],
      users: []
    };

    // Dark Mode Steuerung
    function initTheme() {
      const isDark = localStorage.getItem('theme') === 'dark' || 
        (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (isDark) {
        document.documentElement.classList.add('dark');
        document.getElementById('themeIcon').textContent = '☀️';
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('themeIcon').textContent = '🌙';
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
    }

    // Lokale Person Speicherung
    function saveSelectedUser(user) {
      localStorage.setItem('preferredUser', user);
    }

    // Daten laden
    async function loadData() {
      showStatus("Synchronisiere...");
      try {
        const res = await fetch(APPS_SCRIPT_URL);
        const data = await res.json();
        state = data;
        render();
        showStatus("");
      } catch (err) {
        showStatus("Fehler beim Laden");
        console.error(err);
      }
    }

    // Artikel hinzufügen
    async function addItem(e) {
      e.preventDefault();
      const nameInput = document.getElementById('itemName');
      const qtyInput = document.getElementById('itemQuantity');
      const marketSelect = document.getElementById('itemMarket');
      const userSelect = document.getElementById('itemUser');

      const newItem = {
        id: 'id_' + Date.now(),
        name: nameInput.value.trim(),
        quantity: qtyInput.value.trim() || "1",
        market: marketSelect.value || "Allgemein",
        user: userSelect.value || "",
        checked: false
      };

      if (!newItem.name) return;

      // Optimistische UI-Aktualisierung
      state.items.push(newItem);
      render();

      nameInput.value = "";
      qtyInput.value = "1";

      showStatus("Speichere...");
      try {
        await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ action: "add", ...newItem })
        });
        showStatus("");
      } catch (err) {
        showStatus("Fehler beim Speichern");
        loadData();
      }
    }

    // Status Umschalten (Erledigt)
    async function toggleItem(id) {
      const item = state.items.find(i => i.id === id);
      if (item) item.checked = !item.checked;
      render();

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ action: "toggle", id: id })
        });
      } catch (err) {
        loadData();
      }
    }

    // Artikel Löschen
    async function deleteItem(id) {
      state.items = state.items.filter(i => i.id !== id);
      render();

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ action: "delete", id: id })
        });
      } catch (err) {
        loadData();
      }
    }

    function showStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    // Rendering-Logik mit Hex-Farben
    function render() {
      // 1. Märkte-Dropdown aktualisieren
      const marketSelect = document.getElementById('itemMarket');
      const currentMarket = marketSelect.value;
      marketSelect.innerHTML = state.markets.map(m => 
        `<option value="${m.name}">${m.name}</option>`
      ).join('');
      if (currentMarket && state.markets.some(m => m.name === currentMarket)) {
        marketSelect.value = currentMarket;
      }

      // 2. User-Dropdown aktualisieren
      const userSelect = document.getElementById('itemUser');
      const savedUser = localStorage.getItem('preferredUser');
      userSelect.innerHTML = `<option value="">Wer?</option>` + state.users.map(u => 
        `<option value="${u}">${u}</option>`
      ).join('');
      
      if (savedUser && state.users.includes(savedUser)) {
        userSelect.value = savedUser;
      }

      // 3. Artikel nach Märkten gruppieren
      const listContainer = document.getElementById('itemList');
      listContainer.innerHTML = "";

      if (state.items.length === 0) {
        listContainer.innerHTML = `
          <div class="text-center py-12 text-slate-400">
            <span class="text-4xl block mb-2">🎉</span>
            <p>Alles erledigt! Keine Artikel auf der Liste.</p>
          </div>`;
        return;
      }

      // Nach Markt gruppieren
      const grouped = {};
      state.items.forEach(item => {
        const m = item.market || "Allgemein";
        if (!grouped[m]) grouped[m] = [];
        grouped[m].push(item);
      });

      // Rendern pro Markt
      Object.keys(grouped).forEach(marketName => {
        const items = grouped[marketName];
        const marketConfig = state.markets.find(m => m.name === marketName) || {
          bgColor: "#e5e7eb",
          textColor: "#1f2937",
          headerColor: "#f3f4f6"
        };

        const section = document.createElement('div');
        section.className = "rounded-2xl bg-white dark:bg-slate-800 shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden";

        // Header mit Spalte-D-Farbe
        const header = document.createElement('div');
        header.className = "px-4 py-3 font-semibold text-sm flex items-center justify-between";
        header.style.backgroundColor = marketConfig.headerColor;
        // Dunkle Schrift für gute Lesbarkeit auf hellen Tönen sicherstellen
        header.style.color = "#0f172a"; 
        header.innerHTML = `<span>${marketName}</span> <span class="text-xs opacity-60">${items.length} Artikel</span>`;

        const ul = document.createElement('ul');
        ul.className = "divide-y divide-slate-100 dark:divide-slate-700/50";

        items.forEach(item => {
          const li = document.createElement('li');
          li.className = "p-3.5 flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-700/30 transition-colors";

          li.innerHTML = `
            <div class="flex items-center gap-3 min-w-0 cursor-pointer" onclick="toggleItem('${item.id}')">
              <input type="checkbox" ${item.checked ? 'checked' : ''} 
                     class="w-5 h-5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
              <div class="min-w-0">
                <p class="text-sm font-medium ${item.checked ? 'line-through text-slate-400 dark:text-slate-500' : ''}">
                  ${item.name}
                </p>
                <div class="flex items-center gap-2 mt-0.5">
                  <span class="text-xs text-slate-500 dark:text-slate-400">Menge: ${item.quantity}</span>
                  ${item.user ? `<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">👤 ${item.user}</span>` : ''}
                </div>
              </div>
            </div>

            <div class="flex items-center gap-2">
              <!-- Markt Badge mit Spalte B (Background) & Spalte C (Text) -->
              <span class="text-xs px-2.5 py-1 rounded-lg font-medium shadow-sm"
                    style="background-color: ${marketConfig.bgColor}; color: ${marketConfig.textColor};">
                ${marketName}
              </span>

              <button onclick="deleteItem('${item.id}')" class="text-slate-300 hover:text-red-500 p-1 text-base transition-colors">
                ✕
              </button>
            </div>
          `;
          ul.appendChild(li);
        });

        section.appendChild(header);
        section.appendChild(ul);
        listContainer.appendChild(section);
      });
    }

    // Init beim Start
    initTheme();
    loadData();
  </script>
</body>
</html>
